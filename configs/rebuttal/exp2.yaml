# ============================================================================
# EXP 2 — Query-Scrambled Evaluation (CITA_Instruct, joint vs shortcut)
# Targets shuX W3 (shortcut learning), W8 (potential shortcut)
# ============================================================================
# 4 variants tested on the SAME prompt set:
#   full       : original (I, X) pairs from ECLIPTICA   ← cached, NO re-generation
#   scrambled  : (I, X') where X' is a different prompt's text (joint structure broken)
#   i_only     : (I) only, X replaced with "Please respond."
#   x_only     : (X) only, instruction dropped
#
# Decision rule:
#   full ≫ scrambled  → joint (I,X) learning  ← desired result
#   full ≈ scrambled  → shortcut (I → style)  ← what shuX is afraid of
# ============================================================================

# Focal model — only run CITA_Instruct (target of shuX W3/W8)
model: CITA_Instruct

# Sample size — small for speed, increase if results are noisy
n_prompts: 100              # of 300 unique prompts available
n_instructions: 10           # all 10
n_inferences: 3000           # 100 × 10 × 3 new conditions (full is cached)

# Cached input
existing_responses_csv: outputs/evaluation/ISD_Evaluation_Embedding/CITA_Instruct/CITA_Instruct_isd_responses.csv

# Outputs
output_dir: outputs/rebuttal/exp2_query_scrambled

# Generation params (match what isd.py uses for fair comparison)
max_new_tokens: 256
batch_size: 4               # tight for 25 GB VRAM
temperature: 0.7
top_p: 0.9
do_sample: true

# Scrambling
seed: 42

# Embedding (re-score fidelity, same as Exp 1)
embedding_model: all-MiniLM-L6-v2

# Bootstrap CI (CLAUDE.md §7.4)
n_bootstrap: 10000
confidence_level: 0.95

# Placeholder text for i_only condition
i_only_placeholder: "Please respond."
