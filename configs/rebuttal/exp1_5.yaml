# ============================================================================
# EXP 1.5 — Per-Instruction Instruction-Awareness Score
# Targets shuX W4/W5 + the actual paper-headline metric (CITA 0.37 vs DPO 0.25)
# ============================================================================
# Formula (matches src/utils/eval/isd_metrics.py):
#   per_prompt_awareness(P, X) = fidelity(P, X) * shift(P, X)
#   shift(P, X) = 1 - cosine(R(P,X), mean_R(P,*))   ← deviation from prompt-centroid
# ============================================================================

methods:
  - SFT_NoInstruct
  - SFT_Instruct
  - DPO_NoInstruct
  - DPO_Instruct
  - PPO_NoInstruct
  - PPO_Instruct
  - GRPO_NoInstruct
  - GRPO_Instruct
  - CITA_NoInstruct
  - CITA_Instruct

plot_methods:
  - SFT_Instruct
  - DPO_Instruct
  - PPO_Instruct
  - GRPO_Instruct
  - CITA_Instruct

data_dir: outputs/evaluation/ISD_Evaluation_Embedding
responses_filename_pattern: "{method}_isd_responses.csv"

# Reuse Exp 1's per-prompt fidelities (avoid re-scoring)
exp1_fidelities_csv: outputs/rebuttal/exp1_per_instruction/per_prompt_fidelities.csv

output_dir: outputs/rebuttal/exp1_5_awareness

embedding_model: all-MiniLM-L6-v2

# Bootstrap (CLAUDE.md §7.4)
n_bootstrap: 10000
confidence_level: 0.95
seed: 42

# Save embeddings as .npy (reusable for Exp 2 query-scrambled)
save_embeddings: true

reference_method: CITA_Instruct
challenger_method: DPO_Instruct
